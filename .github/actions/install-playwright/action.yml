name: Install Playwright Chromium
description: >-
  Installs Playwright's Chromium and its system dependencies, caching the
  browser download by Playwright version and retrying installs that fail or
  stall.

runs:
  using: composite
  steps:
    - name: Read Playwright version
      id: version
      shell: bash
      run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browser cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.version.outputs.version }}

    # A cache hit already has the browser, so only the system packages are
    # installed. install.sh caps and retries each attempt.
    - name: Install Chromium and system dependencies
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: "$GITHUB_ACTION_PATH/install.sh"

    # Saved right after installing rather than at the end of the job, so the
    # cache is populated even when the tests themselves fail.
    - name: Save Playwright browser cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.cache.outputs.cache-primary-key }}
