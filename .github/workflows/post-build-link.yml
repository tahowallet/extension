name: Post build link

on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        type: string
        description: "The id of a workflow run to dispatch off of."
        required: true
  workflow_run:
    workflows:
      - Build
    types:
      - completed

jobs:
  post-link:
    # Only builds for pull requests have a PR to link from; builds for pushes
    # to main or tags are skipped. Manual dispatches always run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Post artifact link to PR if available
        uses: actions/github-script@v9
        with:
          script: |
            const postBuildLink = require("./.github/workflows/builds/post-build-link.js")
            await postBuildLink({ github, context })
