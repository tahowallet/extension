name: Build

on:
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - v*

# A new push to a pull request supersedes its in-progress build. Pushes to
# main and tags each get their own group, so none of them are cancelled or
# replaced while queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs get a read-only token unless they ask for more below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Creating releases on tags.
      contents: write
      # Reading the PR description for its testing env block.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Detect env block
        id: env-block
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v9
        with:
          script: |
            const detectEnvBlock = require("./.github/workflows/builds/detect-env-block.js")
            return await detectEnvBlock({ github, context })
          result-encoding: string
      - name: Dev build
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: |
          printf "%s\n" "$ENV_BLOCK" > .env
          echo 'USE_ANALYTICS_SOURCE="BETA"' >> .env
          bun run build
        env:
          ENV_BLOCK: ${{ steps.env-block.outputs.result }}
          BOAR_RPC_URL_ETHEREUM: ${{ secrets.DEV_BOAR_RPC_URL_ETHEREUM || 'https://ethereum-mainnet.boar.network/placeholder-key' }}
          BOAR_RPC_URL_OPTIMISM: ${{ secrets.DEV_BOAR_RPC_URL_OPTIMISM || 'https://optimism-mainnet.boar.network/placeholder-key' }}
          BOAR_RPC_URL_POLYGON: ${{ secrets.DEV_BOAR_RPC_URL_POLYGON || 'https://polygon-mainnet.boar.network/placeholder-key' }}
          BOAR_RPC_URL_ARBITRUM_ONE: ${{ secrets.DEV_BOAR_RPC_URL_ARBITRUM_ONE || 'https://arbitrum-mainnet.boar.network/placeholder-key' }}
          BOAR_RPC_URL_SEPOLIA: ${{ secrets.DEV_BOAR_RPC_URL_SEPOLIA || 'https://ethereum-sepolia.boar.network/placeholder-key' }}
          BOAR_RPC_URL_MEZO: ${{ secrets.DEV_BOAR_RPC_URL_MEZO || 'https://rpc-http.mezo.boar.network/placeholder-key' }}
          ZEROX_API_KEY: ${{ secrets.DEV_ZEROX_API_KEY }}
          DAYLIGHT_API_KEY: ${{ secrets.DAYLIGHT_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
      - name: Production build
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo 'USE_ANALYTICS_SOURCE="PROD"' >> .env
          bun run build
        env:
          BOAR_RPC_URL_ETHEREUM: ${{ secrets.BOAR_RPC_URL_ETHEREUM }}
          BOAR_RPC_URL_OPTIMISM: ${{ secrets.BOAR_RPC_URL_OPTIMISM }}
          BOAR_RPC_URL_POLYGON: ${{ secrets.BOAR_RPC_URL_POLYGON }}
          BOAR_RPC_URL_ARBITRUM_ONE: ${{ secrets.BOAR_RPC_URL_ARBITRUM_ONE }}
          BOAR_RPC_URL_SEPOLIA: ${{ secrets.BOAR_RPC_URL_SEPOLIA }}
          BOAR_RPC_URL_MEZO: ${{ secrets.BOAR_RPC_URL_MEZO }}
          UNS_API_KEY: ${{ secrets.UNS_API_KEY }}
          SIMPLE_HASH_API_KEY: ${{ secrets.SIMPLE_HASH_API_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          POAP_API_KEY: ${{ secrets.POAP_API_KEY }}
          DAYLIGHT_API_KEY: ${{ secrets.DAYLIGHT_API_KEY }}
      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-pre') || contains(github.ref, 'v0.') }}
      - name: Upload build asset
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: extension-builds-${{ github.event.number || github.event.head_commit.id }}
          path: dist/*.zip
      - name: Dev build on Mainnet fork
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: |
          printf "%s\n" "$ENV_BLOCK" > .env
          echo 'USE_ANALYTICS_SOURCE="BETA"' >> .env
          bun run build
          find dist -name "*.zip" -exec sh -c 'mv "$1" "${1%.zip}-fork.zip"' _ {} \;
        env:
          ENV_BLOCK: ${{ steps.env-block.outputs.result }}
          BOAR_RPC_URL_ETHEREUM: ${{ secrets.DEV_BOAR_RPC_URL_ETHEREUM || 'https://ethereum-mainnet.boar.network/placeholder-key' }}
          BOAR_RPC_URL_OPTIMISM: ${{ secrets.DEV_BOAR_RPC_URL_OPTIMISM || 'https://optimism-mainnet.boar.network/placeholder-key' }}
          BOAR_RPC_URL_POLYGON: ${{ secrets.DEV_BOAR_RPC_URL_POLYGON || 'https://polygon-mainnet.boar.network/placeholder-key' }}
          BOAR_RPC_URL_ARBITRUM_ONE: ${{ secrets.DEV_BOAR_RPC_URL_ARBITRUM_ONE || 'https://arbitrum-mainnet.boar.network/placeholder-key' }}
          BOAR_RPC_URL_SEPOLIA: ${{ secrets.DEV_BOAR_RPC_URL_SEPOLIA || 'https://ethereum-sepolia.boar.network/placeholder-key' }}
          BOAR_RPC_URL_MEZO: ${{ secrets.DEV_BOAR_RPC_URL_MEZO || 'https://rpc-http.mezo.boar.network/placeholder-key' }}
          DAYLIGHT_API_KEY: ${{ secrets.DAYLIGHT_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          USE_MAINNET_FORK: true
      - name: Production build on Mainnet fork
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo 'USE_ANALYTICS_SOURCE="BETA"' >> .env
          bun run build
          find dist -name "*.zip" -exec sh -c 'mv "$1" "${1%.zip}-fork.zip"' _ {} \;
        env:
          BOAR_RPC_URL_ETHEREUM: ${{ secrets.BOAR_RPC_URL_ETHEREUM }}
          BOAR_RPC_URL_OPTIMISM: ${{ secrets.BOAR_RPC_URL_OPTIMISM }}
          BOAR_RPC_URL_POLYGON: ${{ secrets.BOAR_RPC_URL_POLYGON }}
          BOAR_RPC_URL_ARBITRUM_ONE: ${{ secrets.BOAR_RPC_URL_ARBITRUM_ONE }}
          BOAR_RPC_URL_SEPOLIA: ${{ secrets.BOAR_RPC_URL_SEPOLIA }}
          BOAR_RPC_URL_MEZO: ${{ secrets.BOAR_RPC_URL_MEZO }}
          UNS_API_KEY: ${{ secrets.UNS_API_KEY }}
          SIMPLE_HASH_API_KEY: ${{ secrets.SIMPLE_HASH_API_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          POAP_API_KEY: ${{ secrets.POAP_API_KEY }}
          DAYLIGHT_API_KEY: ${{ secrets.DAYLIGHT_API_KEY }}
          USE_MAINNET_FORK: true
      - name: Upload build asset
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: extension-builds-fork-${{ github.event.number || github.event.head_commit.id }}
          path: dist/*.zip
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: .github/workflows/pledge-signer-sync
      - run: bun install --frozen-lockfile
        working-directory: scripts/key-generation
      - run: bun run lint
  detect-if-flag-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a pull request's changed files through the API.
      pull-requests: read
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - '.env.defaults'
  e2e-tests:
    needs: [build, detect-if-flag-changed]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # https://playwright.dev/docs/service-workers-experimental
      PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Playwright Browsers
        uses: ./.github/actions/install-playwright
        # Backstop for the per-attempt caps inside the action.
        timeout-minutes: 12
      - uses: actions/download-artifact@v8
        with:
          name: extension-builds-${{ github.event.number || github.event.head_commit.id }}
      - name: Extract extension
        run: unzip -o chrome.zip -d dist/chrome
      # Some tests that we have configured in the `e2e-tests` folder may require
      # spending funds. Although they're desined to not spend much, with
      # frequent execution that can accumulate. We don't want to execute such
      # tests on every PR update. We'll tag those tests with the `@expensive`
      # tag.
      - name: Run free Playwright tests
        env:
          E2E_TEST_ONLY_WALLET_JSON_BODY: ${{ secrets.E2E_TEST_ONLY_WALLET_JSON_BODY }}
          E2E_TEST_ONLY_WALLET_JSON_PASSWORD: ${{ secrets.E2E_TEST_ONLY_WALLET_JSON_PASSWORD }}
        run: xvfb-run bun run e2e:regular
        #env:
        # DEBUG: pw:api*
      - name: Run testnet Playwright tests
        if: |
          github.ref == 'refs/heads/main'
            || contains(github.head_ref, 'e2e')
            || needs.detect-if-flag-changed.outputs.path-filter == 'true'
        env:
          TESTNET_TEST_WALLET_JSON_BODY: ${{ secrets.TEST_WALLET_JSON_BODY }}
          TESTNET_TEST_WALLET_JSON_PASSWORD: ${{ secrets.TEST_WALLET_JSON_PASSWORD }}
        run: xvfb-run bun run e2e:testnet
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: debug-output
          path: |
            test-results/
            #videos/
          retention-days: 30
  e2e-tests-fork:
    if: |
      github.ref == 'refs/heads/main'
        || contains(github.head_ref, 'e2e')
        || needs.detect-if-flag-changed.outputs.path-filter == 'true'
    needs: [build, detect-if-flag-changed]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # https://playwright.dev/docs/service-workers-experimental
      PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Playwright Browsers
        uses: ./.github/actions/install-playwright
        # Backstop for the per-attempt caps inside the action.
        timeout-minutes: 12
      - uses: actions/download-artifact@v8
        with:
          name: extension-builds-fork-${{ github.event.number || github.event.head_commit.id }}
      - name: Extract extension
        run: unzip -o chrome-fork.zip -d dist/chrome
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      # FORKING_BLOCK and MAINNET_FORK_CHAIN_ID, shared with start-anvil.sh.
      - name: Load fork settings
        run: grep -v '^#' ci/fork.env | grep . >> "$GITHUB_ENV"
      - name: Restore Anvil cache
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.foundry/cache
          key: anvil-${{ env.FORKING_BLOCK }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            anvil-${{ env.FORKING_BLOCK }}-${{ github.ref_name }}-${{ github.sha }}
            anvil-${{ env.FORKING_BLOCK }}-${{ github.ref_name }}-
            anvil-${{ env.FORKING_BLOCK }}-
      - name: Run Anvil
        env:
          CHAIN_API_URL: https://eth-mainnet.g.alchemy.com/v2/${{ secrets.DEV_ALCHEMY_API_KEY }}
        run: |
          ./ci/start-anvil.sh &
          sleep 5
      - name: Run Playwright tests designed for fork
        env:
          FORK_TEST_WALLET_JSON_BODY: ${{ secrets.TEST_WALLET_JSON_BODY }}
          FORK_TEST_WALLET_JSON_PASSWORD: ${{ secrets.TEST_WALLET_JSON_PASSWORD }}
          USE_MAINNET_FORK: true
        run: xvfb-run bun run e2e:fork
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: fork-debug-output
          path: |
            test-results/
            #videos/
          retention-days: 30
      # Wait for anvil to finish and save its cache to disk
      - name: Stop Anvil
        if: ${{ !cancelled() }}
        run: sh ./ci/stop-anvil.sh
      - name: Save Anvil Cache
        uses: actions/cache/save@v6
        # We want to save the cache even if the tests failed. Without the cache
        # the tests almost always fail, so without `if: always()` we would have
        # problem with creating the first cache.
        if: always()
        with:
          path: /home/runner/.foundry/cache
          key: anvil-${{ env.FORKING_BLOCK }}-${{ github.ref_name }}-${{ github.sha }}
